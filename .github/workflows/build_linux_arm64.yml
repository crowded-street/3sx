name: Build (Linux for ARM64 / Raspberry Pi)

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: third_party
          key: ${{ runner.os }}-deps-${{ hashFiles('build-deps.sh') }}

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y $(cat tools/requirements-ubuntu.txt)
          ./build-deps.sh
        shell: bash

      - name: Build for Linux ARM64
        run: |
          set -o pipefail
          CC=clang CXX=clang++ cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel $(nproc) 2>&1 | tee build.log
        shell: bash

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
