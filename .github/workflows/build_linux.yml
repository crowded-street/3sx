name: Build (Linux)

on:
    pull_request:
        branches: [ "main" ]

jobs:
    build:
        runs-on: ${{ matrix.runner.os }}
        strategy:
            matrix:
                runner:
                - os: ubuntu-latest
                  arch: "x86_64"
                - os: ubuntu-24.04-arm
                  arch: "arm64"

        steps:
          - name: Checkout repository
            uses: actions/checkout@v4
            with:
                submodules: true

          - name: Cache dependencies
            uses: actions/cache@v4
            with:
                path: third_party
                key: ${{ runner.os }}-${{ matrix.runner.arch }}-deps-${{ hashFiles('build-deps.sh') }}

          - name: Install dependencies
            run: |
                sudo apt update
                sudo apt install -y $(cat tools/requirements-ubuntu.txt)
                ./build-deps.sh
            shell: bash

          - name: Build for Linux (${{ matrix.runner.arch }})
            run: |
                set -o pipefail
                CC=clang CXX=clang++ cmake -B build -DCMAKE_BUILD_TYPE=Release
                cmake --build build --parallel $(nproc) 2>&1 | tee build.log
            shell: bash

          - name: Upload Linux (${{ matrix.runner.arch }}) build log
            if: always()
            uses: actions/upload-artifact@v4
            with:
                name: build-log-linux-${{ matrix.runner.arch }}
                path: build.log
